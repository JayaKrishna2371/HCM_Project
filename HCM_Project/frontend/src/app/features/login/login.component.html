<div class="login-page">

  <!-- ============ LEFT: Hero / brand panel ============ -->
  <aside class="login-hero" aria-hidden="true">
    <img class="login-hero__bg" src="/assets/images/login-hero.png" alt="" />
    <div class="login-hero__overlay"></div>

    <div class="login-hero__top">
      <span class="brand-pill">
        <span class="brand-pill__icon">
          <svg viewBox="0 0 64 40" width="22" height="14" focusable="false">
            <defs>
              <linearGradient id="brandPillGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#82b8ff"/>
                <stop offset="100%" stop-color="#2f80ff"/>
              </linearGradient>
            </defs>
            <path fill="url(#brandPillGrad)"
              d="M50.3 22.4a12.1 12.1 0 0 0-23.7-3.6 9 9 0 0 0-12.3 8.4 9.1 9.1 0 0 0 9.1 9.1h26.3a7 7 0 0 0 .6-13.9z"/>
          </svg>
        </span>
        <span>HCM Platform</span>
      </span>
    </div>

    <div class="login-hero__copy">
      <h1>Hybrid Cloud<br/>Management Platform</h1>
      <p>Unified control plane for Multi-Cloud operations, Identity and<br/>Governance, Self service, Automation, FinOps</p>
    </div>
  </aside>

  <!-- ============ RIGHT: Sign-in panel ============ -->
  <main class="login-panel" role="main" aria-labelledby="login-title">
    <div class="login-panel__inner">
      <div class="login-panel__logo" aria-hidden="true">
        <svg viewBox="0 0 64 40" width="44" height="28" focusable="false">
          <defs>
            <linearGradient id="cloudGradPanel" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#82b8ff"/>
              <stop offset="100%" stop-color="#2f80ff"/>
            </linearGradient>
          </defs>
          <path fill="url(#cloudGradPanel)"
            d="M50.3 22.4a12.1 12.1 0 0 0-23.7-3.6 9 9 0 0 0-12.3 8.4 9.1 9.1 0 0 0 9.1 9.1h26.3a7 7 0 0 0 .6-13.9z"/>
        </svg>
      </div>

      <h2 id="login-title" class="login-panel__title">Sign in to your account</h2>
      <p class="login-panel__subtitle">Use your Active Directory account to access HCM Platform</p>

      <form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <!-- Username / Email -->
        <div class="field" [class.field--invalid]="
            form.controls.username.invalid && form.controls.username.touched
          ">
          <span class="field__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor"
              d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4 0-9 2-9 6v2h18v-2c0-4-5-6-9-6z"/></svg>
          </span>
          <input
            type="text"
            formControlName="username"
            autocomplete="username"
            placeholder="AD username (e.g. jdoe or jdoe@corp)"
            aria-label="Active Directory username"
          />
        </div>

        <!-- Password -->
        <div class="field" [class.field--invalid]="
            form.controls.password.invalid && form.controls.password.touched
          ">
          <span class="field__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor"
              d="M17 8h-1V6a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2zm-7-2a2 2 0 0 1 4 0v2h-4z"/></svg>
          </span>
          <input
            type="password"
            formControlName="password"
            autocomplete="current-password"
            placeholder="Password"
            aria-label="Password"
          />
        </div>

        <!-- Keep me signed in + Forgot -->
        <div class="row">
          <label class="checkbox">
            <input type="checkbox" formControlName="remember" />
            <span class="checkbox__box" aria-hidden="true"></span>
            <span>Keep me signed in</span>
          </label>
          <button type="button" class="link" (click)="onForgotPassword()">
            Forgot password?
          </button>
        </div>

        <!-- Sign In (Active Directory) -->
        <button
          type="submit"
          class="btn btn--primary"
          [disabled]="isBusy() || form.invalid"
        >
          @if (isBusy()) {
            <app-spinner [size]="16" />
          }
          <span>Sign In</span>
        </button>

        <p class="footer-note">SECURED BY ACTIVE DIRECTORY · LDAP</p>
      </form>
    </div>
  </main>
</div>
