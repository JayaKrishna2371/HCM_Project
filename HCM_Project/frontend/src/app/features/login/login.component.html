<div class="login-page">
  <!-- Background image + gradient veil for enterprise contrast -->
  <div class="login-page__bg" aria-hidden="true"></div>
  <div class="login-page__veil" aria-hidden="true"></div>

  <!-- Centered card -->
  <main class="login-card" role="main" aria-labelledby="login-title">
    <!-- Cloud icon -->
    <div class="login-card__logo" aria-hidden="true">
      <svg viewBox="0 0 64 40" width="64" height="40" focusable="false">
        <defs>
          <linearGradient id="cloudGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"  stop-color="#82b8ff"/>
            <stop offset="100%" stop-color="#2f80ff"/>
          </linearGradient>
        </defs>
        <path
          fill="url(#cloudGrad)"
          d="M50.3 22.4a12.1 12.1 0 0 0-23.7-3.6 9 9 0 0 0-12.3 8.4 9.1 9.1 0 0 0 9.1 9.1h26.3a7 7 0 0 0 .6-13.9z"
        />
      </svg>
    </div>

    <h1 id="login-title" class="login-card__title">HYBRID CLOUD PORTAL</h1>
    <p class="login-card__subtitle">Sign in to continue</p>

    <form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <!-- Username / Email -->
      <div class="field" [class.field--invalid]="
          form.controls.username.invalid && form.controls.username.touched
        ">
        <span class="field__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor"
            d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4 0-9 2-9 6v2h18v-2c0-4-5-6-9-6z"/></svg>
        </span>
        <input
          type="text"
          formControlName="username"
          autocomplete="username"
          placeholder="Username or Email"
          aria-label="Username or Email"
        />
      </div>

      <!-- Password -->
      <div class="field" [class.field--invalid]="
          form.controls.password.invalid && form.controls.password.touched
        ">
        <span class="field__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor"
            d="M17 8h-1V6a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2zm-7-2a2 2 0 0 1 4 0v2h-4z"/></svg>
        </span>
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="Password"
          aria-label="Password"
        />
      </div>

      <!-- Remember + Forgot -->
      <div class="row">
        <label class="checkbox">
          <input type="checkbox" formControlName="remember" />
          <span class="checkbox__box" aria-hidden="true"></span>
          <span>Remember me</span>
        </label>
        <button type="button" class="link" (click)="onForgotPassword()">
          Forgot Password?
        </button>
      </div>

      <!-- Sign In (local, disabled in Phase 1) -->
      <button
        type="submit"
        class="btn btn--primary"
        [disabled]="isBusy() || form.invalid"
      >
        @if (isBusy()) {
          <app-spinner [size]="16" />
        }
        <span>Sign In</span>
      </button>

      <!-- Divider -->
      <div class="divider"><span>or</span></div>

      <!-- Azure AD SSO (the real path) -->
      <button
        type="button"
        class="btn btn--azure"
        [disabled]="isAzureBusy()"
        (click)="onAzureAdLogin()"
      >
        <span class="btn__icon" aria-hidden="true">
          <!-- Microsoft 4-square -->
          <svg viewBox="0 0 21 21" width="18" height="18">
            <rect x="1"  y="1"  width="9" height="9" fill="#F25022"/>
            <rect x="11" y="1"  width="9" height="9" fill="#7FBA00"/>
            <rect x="1"  y="11" width="9" height="9" fill="#00A4EF"/>
            <rect x="11" y="11" width="9" height="9" fill="#FFB900"/>
          </svg>
        </span>
        @if (isAzureBusy()) {
          <app-spinner [size]="16" />
        }
        <span>Sign in with Azure AD</span>
      </button>

      <p class="footer-note">MFA Enabled</p>
    </form>
  </main>
</div>
